<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Runner - Sempre na Casa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../frontend/css/main.css?v=3">

    <style>
        /* Contenedores internos ocultos — data.js los usa para construir resultados */
        #contenedor_IU_form, #IU_Test_result_nofile, #IU_Test_result_file, #form_iu { display: none; }
    </style>
</head>
<body class="bg-light">
    <div class="d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="login-card" style="max-width: 640px;">

            <div class="text-center mb-4">
                <img src="../frontend/assets/images/logo.JPG" alt="Logo" width="70" height="70" class="rounded-circle mb-3 logo-shadow"
                     onerror="this.src='https://ui-avatars.com/api/?name=QA&background=7A99DD&color=fff'">
                <h2 class="fw-bold mb-1">Frontend Test Runner</h2>
                <p class="text-muted small mb-0">Ejecuta la batería de tests de las entidades del frontend</p>
            </div>

            <div class="mb-3">
                <label for="entidad_select" class="form-label fw-semibold">Entidad a probar</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-diagram-3 text-muted"></i>
                    </span>
                    <select id="entidad_select" class="form-select border-start-0 bg-light">
                        <option value="usuario">usuario</option>
                        <option value="vivienda">vivienda</option>
                        <option value="criterio">criterio</option>
                        <option value="opcion">opcion</option>
                        <option value="usuario_vivienda">usuario_vivienda</option>
                        <option value="usuario_criterio_opcion">usuario_criterio_opcion</option>
                        <option value="vivienda_criterio_opcion">vivienda_criterio_opcion</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn btn-primary-inverse w-100 fw-bold py-2 rounded-pill mb-3" onclick="ejecutarTests()">
                <i class="bi bi-play-circle me-1"></i>
                Ejecutar Tests
            </button>

            <div id="runner_status" class="alert alert-info d-flex align-items-start gap-2 mb-0" role="status">
                <i class="bi bi-info-circle mt-1"></i>
                <span>Selecciona una entidad y pulsa "Ejecutar Tests". Los resultados se abren en una nueva ventana.</span>
            </div>

        </div>
    </div>

    <!-- Contenedores requeridos por Data_Test (ocultos en esta página) -->
    <form id="form_iu"></form>
    <div id="contenedor_IU_form"></div>
    <div id="IU_Test_result_nofile"></div>
    <div id="IU_Test_result_file"></div>

    <!-- 1. Cookies, la real del proyecto -->
    <script src="../frontend/js/cookies.js?v=3"></script>

    <!-- Puente a i18n y a las reglas/lógica de validación genérica reales, única fuente de
         verdad compartida con el frontend real (ver frontend/js/i18n.js y
         frontend/js/validaciones-campos.js -- reglas + validadores en un único módulo --,
         usados por auth.js, form-errors.js y perfil-comun.js). Son módulos ES (los scripts
         de abajo son clásicos), así que se republican como globales: initI18n() ya
         deja "t"/"setLang"/"getLang" en window (ver i18n.js), y aquí además se exponen
         "REGLAS_CAMPOS.<entidad>.<campo>" y "Validadores.<funcion>" para que los lean
         pruebas/entidades/validaciones.js y las clases de entidad. Los scripts clásicos se ejecutan
         antes que este módulo (que se difiere como un <script defer>), pero no hay problema:
         solo se leen estos globales dentro de los métodos de validación o al pulsar "Ejecutar
         Tests", muy después de que la página haya terminado de cargar. -->
    <script type="module">
        window._reglasListo = import('../frontend/js/validaciones-campos.js?v=3').then(reglasMod => {
            window.REGLAS_CAMPOS = reglasMod.REGLAS_CAMPOS;
            window.Validadores = reglasMod;
        });

        window._i18nListo = import('../frontend/js/i18n.js?v=3').then(i18nMod => i18nMod.initI18n());
    </script>

    <!-- 2. Validaciones y DOM -->
    <script src="entidades/validaciones.js?v=3"></script>
    <script src="DOM_class.js?v=3"></script>

    <!-- 3. Clase base -->
    <script src="Entidad_Abstracta.js?v=3"></script>

    <!-- 4. Clases de entidad -->
    <script src="entidades/usuario.js?v=3"></script>
    <script src="entidades/vivienda.js?v=3"></script>
    <script src="entidades/criterio.js?v=3"></script>
    <script src="entidades/opcion.js?v=3"></script>
    <script src="entidades/usuario_vivienda.js?v=3"></script>
    <script src="entidades/usuario_criterio_opcion.js?v=3"></script>
    <script src="entidades/vivienda_criterio_opcion.js?v=3"></script>

    <!-- 5. Datos de prueba y runner -->
    <script src="pruebas.js"></script>
    <script src="data.js"></script>

    <script>
        const mapaEntidades = {
            usuario,
            vivienda,
            criterio,
            opcion,
            usuario_vivienda,
            usuario_criterio_opcion,
            vivienda_criterio_opcion
        };

        async function ejecutarTests() {
            await window._i18nListo;
            await window._reglasListo;

            const nombre = document.getElementById('entidad_select').value;
            const ClaseEntidad = mapaEntidades[nombre];
            const statusEl = document.getElementById('runner_status');

            if (!ClaseEntidad) {
                statusEl.className = 'alert alert-danger d-flex align-items-start gap-2 mb-0';
                statusEl.innerHTML = '<i class="bi bi-x-circle mt-1"></i><span>Entidad no encontrada: ' + nombre + '</span>';
                return;
            }

            statusEl.className = 'alert alert-info d-flex align-items-start gap-2 mb-0';
            statusEl.innerHTML = '<i class="bi bi-hourglass-split mt-1"></i><span>Ejecutando tests para: ' + nombre + '...</span>';

            try {
                new Data_Test(ClaseEntidad);
                statusEl.className = 'alert alert-success d-flex align-items-start gap-2 mb-0';
                statusEl.innerHTML = '<i class="bi bi-check-circle mt-1"></i><span>Tests completados para: ' + nombre + '. Revisa la nueva ventana con los resultados.</span>';
            } catch (e) {
                statusEl.className = 'alert alert-danger d-flex align-items-start gap-2 mb-0';
                statusEl.innerHTML = '<i class="bi bi-x-circle mt-1"></i><span>Error al ejecutar: ' + e.message + '</span>';
                console.error(e);
            }
        }
    </script>
</body>
</html>
