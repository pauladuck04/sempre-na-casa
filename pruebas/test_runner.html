<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Runner - Sempre na Casa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../frontend/css/main.css">

    <style>
        /* Contenedores internos ocultos — data.js los usa para construir resultados */
        #contenedor_IU_form, #IU_Test_result_nofile, #IU_Test_result_file, #form_iu { display: none; }
    </style>
</head>
<body class="bg-light">
    <div class="d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="login-card" style="max-width: 640px;">

            <div class="text-center mb-4">
                <img src="../frontend/assets/images/logo.JPG" alt="Logo" width="70" height="70" class="rounded-circle mb-3 logo-shadow"
                     onerror="this.src='https://ui-avatars.com/api/?name=QA&background=7A99DD&color=fff'">
                <h2 class="fw-bold mb-1">Test Runner</h2>
                <p class="text-muted small mb-0">Ejecuta la batería de tests de las entidades del backend</p>
            </div>

            <div class="mb-3">
                <label for="entidad_select" class="form-label fw-semibold">Entidad a probar</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-diagram-3 text-muted"></i>
                    </span>
                    <select id="entidad_select" class="form-select border-start-0 bg-light">
                        <option value="medicion">usuario</option>
                        <option value="opinion">vivienda</option>
                        <option value="parametro">criterio</option>
                        <option value="parcela">opcion</option>
                        <option value="parcela_proceso">usuario_vivienda</option>
                        <option value="proceso">usuario_criterio_opcion</option>
                        <option value="usuario">vivienda_criterio_opcion</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn btn-primary-inverse w-100 fw-bold py-2 rounded-pill mb-3" onclick="ejecutarTests()">
                <i class="bi bi-play-circle me-1"></i>
                Ejecutar Tests
            </button>

            <div id="runner_status" class="alert alert-info d-flex align-items-start gap-2 mb-0" role="status">
                <i class="bi bi-info-circle mt-1"></i>
                <span>Selecciona una entidad y pulsa "Ejecutar Tests". Los resultados se abren en una nueva ventana.</span>
            </div>

        </div>
    </div>

    <!-- Contenedores requeridos por Data_Test (ocultos en esta página) -->
    <form id="form_iu"></form>
    <div id="contenedor_IU_form"></div>
    <div id="IU_Test_result_nofile"></div>
    <div id="IU_Test_result_file"></div>

    <!-- 1. Cookies e idioma (orden obligatorio) -->
     <!-- Revisar como se estan implementando en mi codigo -->
    <script src="../js/cookies.js"></script>
    <script src="../js/textos_ES.js"></script>
    <script src="../js/textos_EN.js"></script>
    <script src="../js/idioma.js"></script>

    <!-- 2. Validaciones y DOM -->
    <script src="../js/validaciones.js"></script>
    <script src="../js/DOM_class.js"></script>

    <!-- 3. Clase base -->
    <script src="../js/Entidad_Abstracta.js"></script>

    <!-- 4. Clases de entidad -->
    <script src="../js/medicion.js"></script>
    <script src="../js/parametro.js"></script>
    <script src="../js/parcela.js"></script>
    <script src="../js/proceso.js"></script>
    <script src="../js/parcela_proceso.js"></script>
    <script src="../js/paises.js"></script>
    <script src="../js/usuario.js"></script>

    <!-- 5. Datos de prueba y runner -->
    <script src="pruebas.js"></script>
    <script src="data.js"></script>

    <script>
        // Respeta el idioma ya elegido en el resto de la app (cookie/localStorage) en vez
        // de forzar español; setLang() sin argumento detecta la preferencia guardada.
        setLang();

        // opinion no tiene clase .js propia — se define aquí con los campos del DB
        class opinion extends Entidad_Abstracta {
            constructor() {
                super();
                this.entidad = 'opinion';
            }
            cargar_formulario_html(id) {
                document.getElementById(id).innerHTML =
                    '<input type="text" id="fecha_opinion" name="fecha_opinion" value="">' +
                    '<input type="text" id="conclusiones" name="conclusiones" value="">';
            }
            ADD_fecha_opinion_validation() {
                const el = document.getElementById('fecha_opinion');
                if (!el || !el.value || el.value.trim() === '') return 'fecha_opinion_format_KO';
                return this._vd('fecha_opinion');
            }
            EDIT_fecha_opinion_validation() { return this.ADD_fecha_opinion_validation(); }
            ADD_conclusiones_validation() { return this._vt('conclusiones', 1, 200, '^[^#@<>]+$'); }
            EDIT_conclusiones_validation() { return this.ADD_conclusiones_validation(); }
            SEARCH_fecha_opinion_validation() { return this._vts('fecha_opinion', 10, '^[\\d\\-]+$'); }
            SEARCH_conclusiones_validation() { return this._vts('conclusiones', 200, '^[^#@<>]+$'); }
        }

        const mapaEntidades = {
            medicion,
            opinion,
            parametro,
            parcela,
            parcela_proceso,
            proceso,
            usuario
        };

        function ejecutarTests() {
            const nombre = document.getElementById('entidad_select').value;
            const ClaseEntidad = mapaEntidades[nombre];
            const statusEl = document.getElementById('runner_status');

            if (!ClaseEntidad) {
                statusEl.className = 'alert alert-danger d-flex align-items-start gap-2 mb-0';
                statusEl.innerHTML = '<i class="bi bi-x-circle mt-1"></i><span>Entidad no encontrada: ' + nombre + '</span>';
                return;
            }

            statusEl.className = 'alert alert-info d-flex align-items-start gap-2 mb-0';
            statusEl.innerHTML = '<i class="bi bi-hourglass-split mt-1"></i><span>Ejecutando tests para: ' + nombre + '...</span>';

            try {
                new Data_Test(ClaseEntidad);
                statusEl.className = 'alert alert-success d-flex align-items-start gap-2 mb-0';
                statusEl.innerHTML = '<i class="bi bi-check-circle mt-1"></i><span>Tests completados para: ' + nombre + '. Revisa la nueva ventana con los resultados.</span>';
            } catch (e) {
                statusEl.className = 'alert alert-danger d-flex align-items-start gap-2 mb-0';
                statusEl.innerHTML = '<i class="bi bi-x-circle mt-1"></i><span>Error al ejecutar: ' + e.message + '</span>';
                console.error(e);
            }
        }
    </script>
</body>
</html>
