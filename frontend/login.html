<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Sempre na Casa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">

</head>
<body>
    <div class="login-bg d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-card">

        <div class="d-flex justify-content-end mb-3">
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1" type="button" id="langDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-globe2"></i>
                    <span id="lang-label">Español</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="langDropdown">
                    <li><button class="dropdown-item lang-option" data-lang="es">🇪🇸 Español</button></li>
                    <li><button class="dropdown-item lang-option" data-lang="en">🇬🇧 English</button></li>
                    <li><button class="dropdown-item lang-option" data-lang="gal">🏴󠁧󠁢󠁳󠁣󠁴󠁿 Galego</button></li>
                </ul>
            </div>
        </div>

        <div class="text-center mb-4">
            <img src="./assets/images/logo.JPG" alt="Logo" width="70" height="70" class="rounded-circle mb-3 logo-shadow">
            <h2 class="fw-bold mb-1" data-i18n="login.welcomeTitle">Bienvenido de nuevo</h2>
            <p class="text-muted small" data-i18n="login.welcomeSubtitle">Inicia sesión en tu cuenta de Sempre na Casa</p>
        </div>

        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold" data-i18n="login.emailLabel">Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-envelope text-muted"></i>
                    </span>
                    <input type="email" class="form-control border-start-0 bg-light" id="email" name="email"
                           data-i18n-ph="login.emailLabel" placeholder="Email" required>
                </div>
            </div>

            <div class="mb-2">
                <label for="password" class="form-label fw-semibold" data-i18n="login.password">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-lock text-muted"></i>
                    </span>
                    <input type="password" class="form-control border-start-0 bg-light" id="password" name="password"
                           placeholder="••••••••" required>
                    <span class="input-group-text bg-light border-start-0 toggle-password" style="cursor:pointer;">
                        <i class="bi bi-eye text-muted" id="toggleIcon"></i>
                    </span>
                </div>
            </div>

            <div class="text-end mb-4">
                <a href="recuperar-password.html" class="small text-decoration-none link-custom" data-i18n="login.forgotPassword">¿Has olvidado tu contraseña?</a>
            </div>

            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-pill" style="background-color: var(--color-primario);">
                <span data-i18n="login.submit">Entrar</span>
            </button>
        </form>

        <div class="divider my-4">
            <span data-i18n="login.noAccount">¿Aún no tienes cuenta?</span>
        </div>

        <div class="d-flex gap-2">
            <a href="./registro.html?rol=anfitrion" class="btn btn-dark w-50 rounded-pill small fw-semibold" data-i18n="login.isHost">
                Soy anfitrión
            </a>
            <a href="./registro.html?rol=huesped" class="btn btn-dark w-50 rounded-pill small fw-semibold" data-i18n="login.isTenant">
                Soy huesped
            </a>
        </div>

    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</body>
</html>
