<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - Sempre na Casa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="login-bg d-flex align-items-center justify-content-center min-vh-100">
        <div class="login-card">
            <div class="text-center mb-4">
                <img src="./assets/images/logo.JPG" alt="Logo" width="70" height="70" class="rounded-circle mb-3 logo-shadow">
                <h2 class="fw-bold mb-1" data-i18n="resetPassword.pageTitle"></h2>
                <p class="text-muted small" data-i18n="resetPassword.subtitle"></p>
            </div>

            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

            <!-- Estado: contraseña restablecida -->
            <div id="success-block" class="d-none">
                <div class="alert alert-success" role="alert">
                    <i class="bi bi-check-circle me-2"></i>
                    <strong data-i18n="resetPassword.success"></strong>
                    <p class="small mb-0 mt-1" data-i18n="resetPassword.successText"></p>
                </div>
                <a href="login.html" class="btn btn-primary w-100 fw-bold py-2 rounded-pill" data-i18n="resetPassword.goToLogin"></a>
            </div>

            <!-- Formulario de restablecimiento -->
            <form id="reset-form">
                <div class="mb-3">
                    <label for="pwd-nueva" class="form-label fw-semibold" data-i18n="profile.newPassword"></label>
                    <div class="position-relative">
                        <input type="password" class="form-control pe-5" id="pwd-nueva" data-i18n-ph="profile.newPasswordPh">
                        <button type="button" class="btn-pwd-toggle" data-toggle-pwd="pwd-nueva" tabindex="-1"><i class="bi bi-eye"></i></button>
                    </div>
                    <div id="pwd-strength-wrap" class="mt-2" style="display:none;">
                        <div class="progress" style="height:4px;">
                            <div class="progress-bar" id="pwd-strength-bar" style="width:0%; transition:width .3s,background-color .3s;"></div>
                        </div>
                        <small class="d-block mt-1" id="pwd-strength-text"></small>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="pwd-confirmar" class="form-label fw-semibold" data-i18n="profile.confirmPassword"></label>
                    <div class="position-relative">
                        <input type="password" class="form-control pe-5" id="pwd-confirmar" data-i18n-ph="profile.confirmPasswordPh">
                        <button type="button" class="btn-pwd-toggle" data-toggle-pwd="pwd-confirmar" tabindex="-1"><i class="bi bi-eye"></i></button>
                    </div>
                </div>

                <button type="submit" id="btn-restablecer" class="btn btn-primary w-100 fw-bold py-2 rounded-pill" data-i18n="resetPassword.submit"></button>
            </form>

            <div class="divider my-4"></div>

            <a href="login.html" class="btn btn-dark w-100 fw-bold py-2 rounded-pill">
                <i class="bi bi-arrow-left me-1"></i>
                <span data-i18n="recoverPassword.backToLogin"></span>
            </a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script type="module" src="js/public/restablecer-password.js"></script>
</body>
</html>
