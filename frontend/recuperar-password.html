<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Sempre na Casa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="login-bg d-flex align-items-center justify-content-center min-vh-100 px-3">
        <div class="login-card">
            <div class="text-center mb-4">
                <img src="./assets/images/logo.JPG" alt="Logo" width="70" height="70" class="rounded-circle mb-3 logo-shadow">
                <h2 class="fw-bold mb-1" data-i18n="recoverPassword.pageTitle">¿Olvidaste tu contraseña?</h2>
                <p class="text-muted small" data-i18n="recoverPassword.subtitle">No te preocupes, introduce tu email y te enviaremos las instrucciones para restablecerla.</p>
            </div>

            <!-- Mensajes de estado -->
            <div id="success-message" class="alert alert-success d-none" role="alert">
                <div class="d-flex align-items-center">
                    <i class="bi bi-check-circle me-2"></i>
                    <span id="success-text" data-i18n="recoverPassword.successText">Enlace generado correctamente.</span>
                </div>
                <p class="small mb-2 mt-2" data-i18n="recoverPassword.linkIntro"></p>
                <a href="#" id="reset-link" class="btn btn-sm btn-primary-inverse rounded-pill" target="_blank" data-i18n="recoverPassword.openLink"></a>
            </div>
            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

            <!-- Formulario de recuperación -->
            <form id="recuperar-form">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold" data-i18n="recoverPassword.emailLabel">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-envelope text-muted"></i>
                        </span>
                        <input type="email" class="form-control border-start-0 bg-light" id="email" name="email"
                               placeholder="tucorreo@ejemplo.com" required>
                    </div>
                    <small class="text-muted d-block mt-2" data-i18n="recoverPassword.emailHelp">Recibirás un email con un enlace para restablecer tu contraseña.</small>
                </div>

                <button type="submit" id="btn-recuperar" class="btn btn-primary-inverse w-100 fw-bold py-2 rounded-pill" data-i18n="recoverPassword.submit">
                    Recuperar contraseña
                </button>
            </form>

            <div class="divider my-4"></div>

            <a href="login.html" class="btn btn-dark w-100 fw-bold py-2 rounded-pill">
                <i class="bi bi-arrow-left me-1"></i>
                <span data-i18n="recoverPassword.backToLogin">Volver al inicio de sesión</span>
            </a>
        </div>
    </div>

    <script src="js/cookies.js"></script>
    <script src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</body>
</html>
