<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre nosotros - Sempre na Casa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/settings/variables.css">
    <link rel="stylesheet" href="css/components/components.css">
</head>
<body>
    <div data-partial="partials/navbar-public.html"></div>
    <section class="py-5" style="background-color: #7A99DD;">
        <div class="container text-white text-center">
            <h1 class="display-5 fw-bold mb-3" data-i18n="about.hero.title"></h1>
            <p class="lead opacity-90 mb-0" data-i18n="about.hero.subtitle"></p>
        </div>
    </section>

    <section class="py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9 text-center">
                    <h2 class="fw-bold mb-4" data-i18n="about.mission.title"></h2>
                    <p class="lead text-muted mb-3" data-i18n="about.mission.text1"></p>
                    <p class="lead text-muted mb-0" data-i18n="about.mission.text2"></p>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <h2 class="fw-bold text-center mb-5" data-i18n="about.values.title"></h2>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm p-4 text-center">
                        <div class="icon-wrapper mb-3">
                            <i class="bi bi-shield-check fs-1" style="color: var(--color-primario);"></i>
                        </div>
                        <h5 class="fw-bold" data-i18n="about.values.v1Title"></h5>
                        <p class="text-muted mb-0" data-i18n="about.values.v1Text"></p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm p-4 text-center">
                        <div class="icon-wrapper mb-3">
                            <i class="bi bi-people fs-1" style="color: var(--color-primario);"></i>
                        </div>
                        <h5 class="fw-bold" data-i18n="about.values.v2Title"></h5>
                        <p class="text-muted mb-0" data-i18n="about.values.v2Text"></p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm p-4 text-center">
                        <div class="icon-wrapper mb-3">
                            <i class="bi bi-heart fs-1" style="color: var(--color-primario);"></i>
                        </div>
                        <h5 class="fw-bold" data-i18n="about.values.v3Title"></h5>
                        <p class="text-muted mb-0" data-i18n="about.values.v3Text"></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5 bg-light">
        <div class="container text-center">
            <h2 class="fw-bold mb-2" data-i18n="about.cta.title"></h2>
            <p class="text-muted mb-4" data-i18n="about.cta.subtitle"></p>
            <a href="tipos-usuarios.html" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold" style="color:white;" data-i18n="about.cta.button"></a>
        </div>
    </section>

    <div data-partial="partials/footer-public.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cookies.js"></script>
    <script type="module" src="js/public/public.js"></script>
</body>
</html>
