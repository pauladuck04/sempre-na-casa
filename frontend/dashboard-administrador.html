<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="js/cookies.js?v=3"></script>
    <script src="js/route-guard.js?v=3"></script>
    <script>protegerRuta(['admin']);</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Sempre na Casa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-light">
    <div class="d-flex dashboard-layout" style="min-height: 100vh;">
        <!-- SIDEBAR: offcanvas responsive -- fijo y siempre visible desde tablet,
             panel deslizante (con botón para abrirlo en <main>) por debajo de tablet. -->
        <div class="offcanvas offcanvas-lg offcanvas-start bg-white shadow-sm" tabindex="-1" id="sidebarOffcanvas" style="--bs-offcanvas-width: 280px;">
            <div class="offcanvas-header d-lg-none">
                <h5 class="offcanvas-title fw-bold mb-0" style="color: var(--color-primario);">Sempre na Casa</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarOffcanvas" aria-label="Cerrar"></button>
            </div>
            <div class="offcanvas-body d-flex flex-column p-lg-4">
                <div class="d-none d-lg-flex flex-column align-items-center mb-4">
                    <img src="assets/images/logo.JPG" width="60" class="rounded-circle mb-2" alt="Logo"
                         onerror="this.src='https://ui-avatars.com/api/?name=Admin&background=7A99DD&color=fff'">
                    <span class="badge bg-dark rounded-pill mb-2" data-i18n="admin.badge">Administrador</span>
                    <h5 class="fw-bold mb-0" style="color: var(--color-primario);">Sempre na Casa</h5>
                </div>

                <nav class="nav flex-column gap-2 flex-grow-1">
                    <a href="#" class="nav-link active-custom transition section-link" data-section="general" data-bs-dismiss="offcanvas">
                        <i class="bi bi-speedometer2 me-2"></i> <span data-i18n="admin.nav.general"></span>
                    </a>
                    <a href="#" class="nav-link text-muted transition section-link" data-section="usuarios" data-bs-dismiss="offcanvas">
                        <i class="bi bi-people me-2"></i> <span data-i18n="admin.nav.users"></span>
                    </a>
                    <a href="#" class="nav-link text-muted transition section-link" data-section="roles" data-bs-dismiss="offcanvas">
                        <i class="bi bi-shield-lock me-2"></i> <span data-i18n="admin.nav.roles"></span>
                    </a>
                    <a href="#" class="nav-link text-muted transition section-link" data-section="viviendas" data-bs-dismiss="offcanvas">
                        <i class="bi bi-houses me-2"></i> <span data-i18n="admin.nav.homes"></span>
                    </a>
                    <a href="#" class="nav-link text-muted transition section-link" data-section="criterios" data-bs-dismiss="offcanvas">
                        <i class="bi bi-diagram-3 me-2"></i> <span data-i18n="admin.nav.criteria"></span>
                    </a>
                    <a href="#" class="nav-link text-muted transition section-link" data-section="solicitudes" data-bs-dismiss="offcanvas">
                        <i class="bi bi-envelope-paper me-2"></i> <span data-i18n="admin.nav.requests"></span>
                    </a>
                    <a href="#" class="nav-link d-none section-link" data-section="perfil"></a>
                    <hr class="my-3">
                    <a href="#" class="nav-link text-muted transition section-link" data-section="frontend-test" data-bs-dismiss="offcanvas">
                        <i class="bi bi-clipboard2-check me-2"></i> <span data-i18n="admin.nav.frontendTest"></span>
                    </a>
                    <a href="#" class="nav-link text-muted transition section-link" data-section="backend-test" data-bs-dismiss="offcanvas">
                        <i class="bi bi-hdd-network me-2"></i> <span data-i18n="admin.nav.backendTest"></span>
                    </a>
                    <hr class="my-3">
                    <a href="public.html" id="btnLogout" class="nav-link text-danger transition">
                        <i class="bi bi-box-arrow-left me-2"></i> <span data-i18n="nav.logout"></span>
                    </a>
                </nav>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="flex-grow-1 p-4 p-md-3">
            <button class="btn btn-outline-secondary d-sm-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas" aria-label="Abrir menú">
                <i class="bi bi-three-dots fs-5"></i>
            </button>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h1 class="fw-bold mb-2" id="section-title" data-i18n="admin.sections.general.title"></h1>
                    <p class="text-muted" id="section-description" data-i18n="admin.sections.general.description"></p>
                </div>
                <div class="d-flex align-items-center">
                    <button id="btnPerfil" class="avatar-iniciales shadow-sm" data-i18n-title="nav.overview" title="Ver mi perfil"></button>
                </div>
            </div>

            <div id="content-sections">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="gap-2 d-none flex-wrap" id="acciones-globales">
                        <button type="button" class="btn btn-primary rounded-pill px-2 shadow-sm" id="btnCrear">
                            <i class="bi bi-plus-circle me-2"></i><span class="btn-label" data-i18n="buttons.create"></span>
                        </button>
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-2" id="btnEditar" disabled>
                            <i class="bi bi-pencil me-2"></i><span class="btn-label" data-i18n="buttons.edit"></span>
                        </button>
                        <button type="button" class="btn btn-outline-danger rounded-pill px-2" id="btnEliminar" disabled>
                            <i class="bi bi-trash me-2"></i><span class="btn-label" data-i18n="buttons.delete"></span>
                        </button>
                        <button type="button" class="btn btn-outline-success rounded-pill px-2" id="btnReactivar" disabled>
                            <i class="bi bi-arrow-clockwise me-2"></i><span class="btn-label" data-i18n="buttons.reactivate"></span>
                        </button>
                    </div>
                    <div class="gap-2 flex-wrap d-none" id="filtros-globales">
                        <input type="search" class="form-control" id="filtroTexto" data-i18n-ph="nav.filterList">
                        <div class="d-flex gap-2 flex-wrap" id="filtrosEspecificos"></div>
                    </div>
                </div>

                <!-- SECCIÓN: GENERAL -->
                <div class="section-content active" data-section="general">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-bottom py-4">
                            <h5 class="fw-bold mb-0">
                                <i class="me-2 text-primary"></i>
                                <span data-i18n="admin.cardTitles.convivencias"></span>
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Anfitrión</th>
                                            <th>Huésped</th>
                                            <th>Estado</th>
                                            <th>Fecha inicio</th>
                                            <th>Fecha fin</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-convivencias"></tbody>
                                </table>
                            </div>
                            <div id="paginacion-tabla-convivencias" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3"></div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: USUARIOS -->
                <div class="section-content" data-section="usuarios">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-bottom py-4">
                            <h5 class="fw-bold mb-0">
                                <i class="bi bi-people me-2 text-primary"></i>
                                <span data-i18n="admin.cardTitles.users"></span>
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th data-i18n="admin.table.user"></th>
                                            <th data-i18n="admin.table.role"></th>
                                            <th data-i18n="admin.table.registerDate"></th>
                                            <th data-i18n="admin.table.dni"></th>
                                            <th data-i18n="admin.table.phone"></th>
                                            <th data-i18n="admin.table.status"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-usuarios"></tbody>
                                </table>
                            </div>
                            <div id="paginacion-tabla-usuarios" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3"></div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: ROLES -->
                <div class="section-content" data-section="roles">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-bottom py-4">
                            <h5 class="fw-bold mb-0">
                                <i class="bi bi-shield-lock me-2 text-primary"></i>
                                <span data-i18n="admin.cardTitles.roles"></span>
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th data-i18n="admin.table.roleName"></th>
                                            <th data-i18n="admin.table.status"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-roles"></tbody>
                                </table>
                            </div>
                            <div id="paginacion-tabla-roles" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3"></div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: VIVIENDAS -->
                <div class="section-content" data-section="viviendas">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-bottom py-4">
                            <h5 class="fw-bold mb-0">
                                <i class="bi bi-houses me-2 text-primary"></i>
                                <span data-i18n="admin.cardTitles.homes"></span>
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th data-i18n="admin.table.address"></th>
                                            <th data-i18n="admin.table.freeSlots"></th>
                                            <th data-i18n="admin.table.totalSlots"></th>
                                            <th data-i18n="admin.table.host"></th>
                                            <th data-i18n="admin.table.status"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-viviendas"></tbody>
                                </table>
                            </div>
                            <div id="paginacion-tabla-viviendas" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3"></div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: CRITERIOS -->
                <div class="section-content" data-section="criterios">
                    <ul class="nav nav-tabs mb-3" id="criteriosTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="tab-criterios-btn" data-bs-toggle="tab" data-bs-target="#tab-criterios" type="button" role="tab" data-i18n="admin.criteria.tabCriteria"></button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="tab-opciones-btn" data-bs-toggle="tab" data-bs-target="#tab-opciones" type="button" role="tab" data-i18n="admin.criteria.tabOptions"></button>
                        </li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="tab-criterios" role="tabpanel">
                            <div class="card border-0 shadow-sm rounded-4">
                                <div class="card-body p-4">
                                    <table class="table table-hover align-middle">
                                        <thead class="table-light">
                                            <tr>
                                                <th data-i18n="admin.table.criteria"></th>
                                                <th data-i18n="admin.table.status"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="tabla-criterios"></tbody>
                                    </table>
                                    <div id="paginacion-tabla-criterios" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3"></div>
                                </div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="tab-opciones" role="tabpanel">
                            <div class="card border-0 shadow-sm rounded-4">
                                <div class="card-body p-4">
                                    <table class="table table-hover align-middle">
                                        <thead class="table-light">
                                            <tr>
                                                <th data-i18n="admin.table.options"></th>
                                                <th data-i18n="admin.table.criteria"></th>
                                                <th data-i18n="admin.table.values"></th>
                                                <th data-i18n="admin.table.status"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="tabla-opciones"></tbody>
                                    </table>
                                    <div id="paginacion-tabla-opciones" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: SOLICITUDES -->
                <div class="section-content" data-section="solicitudes">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-bottom py-4">
                            <h5 class="fw-bold mb-0">
                                <i class="bi bi-envelope-paper me-2 text-primary"></i>
                                <span data-i18n="admin.cardTitles.requests"></span>
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th data-i18n="admin.table.guest"></th>
                                            <th data-i18n="admin.table.home"></th>
                                            <th data-i18n="admin.table.host"></th>
                                            <th data-i18n="admin.table.requestDate"></th>
                                            <th data-i18n="admin.table.proposedDates"></th>
                                            <th data-i18n="admin.table.status"></th>
                                            <th data-i18n="admin.table.actions"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-solicitudes"></tbody>
                                </table>
                            </div>
                            <div id="paginacion-tabla-solicitudes" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3"></div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: FRONTEND TEST -->
                <div class="section-content" data-section="frontend-test">
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <iframe id="iframe-frontend-test" data-src="pruebas/test_runner.html"
                            title="Frontend Test Runner" style="width:100%; height:75vh; border:0;"></iframe>
                    </div>
                </div>

                <!-- SECCIÓN: BACKEND TEST -->
                <div class="section-content" data-section="backend-test">
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <iframe id="iframe-backend-test" data-src="../backend/pruebas/backend_runner.html"
                                data-src-prod="http://backsemprenacasa.atwebpages.com/pruebas/backend_runner.html"
                                title="Backend Test Runner" style="width:100%; height:75vh; border:0;"></iframe>
                    </div>
                </div>

                <!-- SECCIÓN: PERFIL -->
                <div class="section-content" data-section="perfil">
                    <div class="row g-4">
                        <div class="col-12 col-lg-4">
                            <div class="card border-0 shadow-sm rounded-4 text-center p-4 mb-4">
                                <div class="avatar-iniciales avatar-iniciales-lg mx-auto mb-3" id="perfil-avatar"></div>
                                <h5 class="fw-bold mb-1" id="perfil-display-nombre"></h5>
                                <span class="badge bg-dark rounded-pill px-3 mb-3" data-i18n="admin.badge"></span>
                                <p class="text-muted small mb-0">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span data-i18n="profile.memberSince"></span> <span id="perfil-fecha-alta"></span>
                                </p>
                            </div>
                            <div class="card border-0 shadow-sm rounded-4 p-4">
                                <h6 class="fw-bold text-danger mb-2">
                                    <i class="bi bi-exclamation-triangle me-2"></i>
                                    <span data-i18n="profile.dangerZone"></span>
                                </h6>
                                <p class="text-muted small mb-3" data-i18n="profile.dangerText"></p>
                                <button class="btn btn-outline-danger rounded-pill w-100 btn-sm" id="btnEliminarCuenta">
                                    <i class="bi bi-trash me-2"></i>
                                    <span data-i18n="profile.deleteMyAccount"></span>
                                </button>
                            </div>
                        </div>

                        <div class="col-12 col-lg-8">
                            <div class="card border-0 shadow-sm rounded-4 mb-4">
                                <div class="card-header bg-white border-bottom py-4 d-flex justify-content-between align-items-center">
                                    <h5 class="fw-bold mb-0">
                                        <i class="bi bi-person me-2 text-primary"></i>
                                        <span data-i18n="profile.personalData"></span>
                                    </h5>
                                    <button class="btn btn-primary-inverse rounded-pill btn-sm px-3" id="perfil-btnEditar">
                                        <i class="bi bi-pencil me-1"></i>
                                        <span data-i18n="profile.edit"></span>
                                    </button>
                                </div>
                                <div class="card-body p-4">
                                    <form id="perfil-form" novalidate>
                                        <div class="row g-3">
                                            <div class="col-12 col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.fullNameLabel"></label>
                                                <input type="text" class="form-control" id="perfil-nombre" value="" disabled>
                                            </div>
                                            <div class="col-12 col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.dniLabel"></label>
                                                <input type="text" class="form-control" id="perfil-dni" value="" disabled>
                                            </div>
                                            <div class="col-12 col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.emailLabel"></label>
                                                <input type="email" class="form-control" id="perfil-email" value="" disabled>
                                            </div>
                                            <div class="col-12 col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.phoneLabel"></label>
                                                <input type="tel" class="form-control" id="perfil-telefono" value="" disabled>
                                            </div>
                                            <div class="col-12">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.cityLabel"></label>
                                                <input type="text" class="form-control" id="perfil-ciudad" value="" disabled>
                                            </div>
                                        </div>
                                        <div class="d-none gap-2 justify-content-end mt-4" id="perfil-acciones">
                                            <button type="button" class="btn btn-light rounded-pill px-4" id="perfil-btnCancelar" data-i18n="buttons.cancel"></button>
                                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                                <i class="bi bi-check-circle me-1"></i>
                                                <span data-i18n="buttons.saveChanges"></span>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <div class="card border-0 shadow-sm rounded-4 mb-4">
                                <div class="card-header bg-white border-bottom py-4">
                                    <h5 class="fw-bold mb-0">
                                        <i class="bi bi-shield-lock me-2 text-primary"></i>
                                        <span data-i18n="profile.changePasswordTitle"></span>
                                    </h5>
                                </div>
                                <div class="card-body p-4">
                                    <form id="perfil-form-pwd" novalidate>
                                        <div class="mb-4">
                                            <label class="form-label fw-semibold text-muted small" data-i18n="profile.currentPassword"></label>
                                            <div class="position-relative">
                                                <input type="password" class="form-control pe-5" id="pwd-actual" data-i18n-ph="profile.currentPasswordPh">
                                                <button type="button" class="btn-pwd-toggle" data-toggle-pwd="pwd-actual" tabindex="-1"><i class="bi bi-eye"></i></button>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold text-muted small" data-i18n="profile.newPassword"></label>
                                            <div class="position-relative">
                                                <input type="password" class="form-control pe-5" id="pwd-nueva" data-i18n-ph="profile.newPasswordPh">
                                                <button type="button" class="btn-pwd-toggle" data-toggle-pwd="pwd-nueva" tabindex="-1"><i class="bi bi-eye"></i></button>
                                            </div>
                                            <div id="pwd-strength-wrap" class="mt-2" style="display:none;">
                                                <div class="progress" style="height:4px;">
                                                    <div class="progress-bar" id="pwd-strength-bar" style="width:0%; transition:width .3s,background-color .3s;"></div>
                                                </div>
                                                <small class="d-block mt-1" id="pwd-strength-text"></small>
                                            </div>
                                        </div>
                                        <div class="mb-4">
                                            <label class="form-label fw-semibold text-muted small" data-i18n="profile.confirmPassword"></label>
                                            <div class="position-relative">
                                                <input type="password" class="form-control pe-5" id="pwd-confirmar" data-i18n-ph="profile.confirmPasswordPh">
                                                <button type="button" class="btn-pwd-toggle" data-toggle-pwd="pwd-confirmar" tabindex="-1"><i class="bi bi-eye"></i></button>
                                            </div>
                                        </div>
                                        <div id="pwd-feedback" class="alert alert-danger d-none mb-3" role="alert"></div>
                                        <div class="text-end">
                                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                                <i class="bi bi-lock me-1"></i>
                                                <span data-i18n="buttons.updatePassword"></span>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div data-partial="partials/dashboard-modals-common.html"></div>

    <!-- Modal Confirmar Eliminar -->
    <div class="modal fade" id="modalConfirmarEliminar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-danger text-white border-0">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span data-i18n="modal.confirmDeleteTitle">Confirmar eliminación</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="mb-0" id="modalConfirmarEliminarMsg" data-i18n="modal.confirmDeleteBody">¿Estás seguro de que deseas eliminar los elementos seleccionados?</p>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" data-i18n="buttons.cancel">Cancelar</button>
                    <button type="button" class="btn btn-danger rounded-pill px-4" id="btnConfirmarEliminar">
                        <i class="bi bi-trash me-1"></i>
                        <span data-i18n="modal.confirmDeleteBtn">Sí, eliminar</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Confirmar Reactivar -->
    <div class="modal fade" id="modalConfirmarReactivar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-success text-white border-0">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-arrow-clockwise me-2"></i>
                        <span data-i18n="modal.confirmReactivateTitle">Confirmar reactivación</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="mb-0" id="modalConfirmarReactivarMsg" data-i18n="modal.confirmReactivateBody">¿Estás seguro de que deseas reactivar los elementos seleccionados?</p>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" data-i18n="buttons.cancel">Cancelar</button>
                    <button type="button" class="btn btn-success rounded-pill px-4" id="btnConfirmarReactivar">
                        <i class="bi bi-arrow-clockwise me-1"></i>
                        <span data-i18n="modal.confirmReactivateBtn">Sí, reactivar</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
