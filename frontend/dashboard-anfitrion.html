<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="js/cookies.js"></script>
    <script src="js/route-guard.js"></script>
    <script>protegerRuta(['anfitrion']);</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Anfitrión - Sempre na Casa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">
    <style>@media (min-width: 992px) { main { margin-left: 280px; } }</style>
</head>
<body class="bg-light">
    <!-- SIDEBAR -->
    <aside class="sidebar bg-white shadow-sm d-none d-lg-block flex-column p-4" style="position: fixed; left: 0; top: 0; height: 100vh; width: 280px;">
        <div class="d-flex flex-column align-items-center mb-4">
            <img src="assets/images/logo.JPG" width="60" class="rounded-circle mb-2" alt="Logo"
                 onerror="this.src='https://ui-avatars.com/api/?name=Anfitrion&background=7A99DD&color=fff'">
            <span class="badge bg-dark rounded-pill mb-2" data-i18n="anfitrion.badge"></span>
            <h5 class="fw-bold mb-0" style="color: var(--color-primario);">Sempre na Casa</h5>
        </div>
        <nav class="nav flex-column gap-2 flex-grow-1">
            <a href="#" class="nav-link active-custom transition section-link" data-section="general">
                <i class="bi bi-speedometer2 me-2"></i> <span data-i18n="anfitrion.nav.general"></span>
            </a>
            <a href="#" class="nav-link text-muted transition section-link" data-section="vivienda">
                <i class="bi bi-house-heart me-2"></i> <span data-i18n="anfitrion.nav.home"></span>
            </a>
            <a href="#" class="nav-link text-muted transition section-link" data-section="criterios">
                <i class="bi bi-sliders me-2"></i> <span data-i18n="anfitrion.nav.criteria"></span>
            </a>
            <a href="#" class="nav-link text-muted transition section-link" data-section="huespedes">
                <i class="bi bi-people me-2"></i> <span data-i18n="anfitrion.nav.tenants"></span>
            </a>
            <a href="#" class="nav-link d-none section-link" data-section="perfil"></a>
            <hr class="my-3">
            <a href="public.html" id="btnLogout" class="nav-link text-danger transition">
                <i class="bi bi-box-arrow-left me-2"></i> <span data-i18n="nav.logout"></span>
            </a>
        </nav>
    </aside>

    <div class="d-flex dashboard-layout" style="min-height: 100vh;">
        <main class="flex-grow-1 p-4 p-md-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h1 class="fw-bold mb-2" id="section-title" data-i18n="anfitrion.sections.general.title"></h1>
                    <p class="text-muted" id="section-description" data-i18n="anfitrion.sections.general.description"></p>
                </div>
                <div class="d-flex align-items-center">
                    <button id="btnPerfil" class="avatar-iniciales shadow-sm" title="Ver mi perfil"></button>
                </div>
            </div>

            <div id="content-sections">
                <div class="d-flex justify-content-between align-items-center mb-0">
                    <div class="gap-2 d-none" id="acciones-globales">
                        <button type="button" class="btn btn-primary rounded-pill px-2 shadow-sm" id="btnCrear">
                            <i class="bi bi-plus-circle me-2"></i> <span data-i18n="buttons.add"></span>
                        </button>
                        <button type="button" class="btn btn-primary-inverse rounded-pill px-2" id="btnEditar" disabled>
                            <i class="bi bi-pencil me-2"></i> <span data-i18n="buttons.edit"></span>
                        </button>
                        <button type="button" class="btn btn-outline-danger rounded-pill px-2" id="btnEliminar" disabled>
                            <i class="bi bi-x-circle me-2"></i> <span data-i18n="buttons.deactivate"></span>
                        </button>
                        <button type="button" class="btn btn-outline-success rounded-pill px-2" id="btnReactivar" disabled>
                            <i class="bi bi-check-circle me-2"></i> <span data-i18n="buttons.activate"></span>
                        </button>
                    </div>
                    <div class="gap-2 flex-wrap d-none" id="filtros-globales">
                        <input type="search" class="form-control" id="filtroTexto" data-i18n-ph="nav.filterList">
                        <div class="d-flex gap-2 flex-wrap" id="filtrosEspecificos"></div>
                    </div>
                </div>

                <!-- SECCIÓN: GENERAL -->
                <div class="section-content active" data-section="general">
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <div class="card border-0 shadow-sm rounded-4 h-100">
                                <div class="card-body p-4 d-flex align-items-center gap-3">
                                    <div class="rounded-3 p-3" style="background-color: #EBF0FF;">
                                        <i class="bi bi-house-check fs-4" style="color: var(--color-primario);"></i>
                                    </div>
                                    <div>
                                        <p class="text-muted small mb-1" data-i18n="anfitrion.summary.homeStatus"></p>
                                        <h5 class="fw-bold mb-0" id="estado-vivienda">-</h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card border-0 shadow-sm rounded-4 h-100">
                                <div class="card-body p-4 d-flex align-items-center gap-3">
                                    <div class="rounded-3 p-3" style="background-color: #E8F5E9;">
                                        <i class="bi bi-people fs-4 text-success"></i>
                                    </div>
                                    <div>
                                        <p class="text-muted small mb-1" data-i18n="anfitrion.summary.occupiedSlots"></p>
                                        <h5 class="fw-bold mb-0" id="plazas-ocupadas">-</h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-bottom py-4">
                            <h5 class="fw-bold mb-0">
                                <i class="bi bi-house-heart me-2 text-primary"></i>
                                <span data-i18n="anfitrion.cardTitles.currentConvivencia"></span>
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th data-i18n="anfitrion.table.tenant"></th>
                                            <th data-i18n="anfitrion.table.startDate"></th>
                                            <th data-i18n="anfitrion.table.status"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-convivencias"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: MI VIVIENDA -->
                <div class="section-content" data-section="vivienda">
                    <div id="sin-vivienda" class="d-none">
                        <div class="card border-0 shadow-sm rounded-4 text-center p-5">
                            <i class="bi bi-house-add fs-1 mb-3" style="color: var(--color-primario);"></i>
                            <h4 class="fw-bold mb-2" data-i18n="anfitrion.cardTitles.noHome"></h4>
                            <p class="text-muted mb-4" data-i18n="anfitrion.cardTitles.noHomeSubtitle"></p>
                            <div>
                                <button class="btn btn-primary rounded-pill px-4" id="btnDarDeAlta">
                                    <i class="bi bi-plus-circle me-2"></i>
                                    <span data-i18n="anfitrion.cardTitles.registerHomeBtn"></span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Panel paso 1: datos de la vivienda -->
                    <div id="form-alta-vivienda" class="d-none">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-4">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h5 class="fw-bold mb-0">
                                        <i class="bi bi-house-add me-2 text-primary"></i>
                                        <span data-i18n="anfitrion.home.registerStep1"></span>
                                    </h5>
                                    <span class="badge rounded-pill px-3 py-2" style="background-color:#EBF0FF;color:var(--color-primario);">1 / 2</span>
                                </div>
                            </div>
                            <div class="card-body p-4">
                                <form id="formAltaVivienda" novalidate>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold" data-i18n="anfitrion.home.address"></label>
                                        <input name="direccion" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold" data-i18n="anfitrion.home.city"></label>
                                        <input name="ciudad" class="form-control" required>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold" data-i18n="anfitrion.home.totalSlots"></label>
                                            <input type="number" name="plazas_totales" class="form-control" min="1" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold" data-i18n="anfitrion.home.freeSlots"></label>
                                            <input type="number" name="plazas_libres" class="form-control" min="0" required>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold" data-i18n="anfitrion.home.descriptionOptional"></label>
                                        <textarea name="descripcion" class="form-control" rows="2"></textarea>
                                    </div>
                                    <div id="formAltaVivienda-error" class="alert alert-danger d-none mb-3"></div>
                                    <div class="d-flex gap-2 justify-content-end">
                                        <button type="button" class="btn btn-light rounded-pill px-4" id="btnCancelarAltaVivienda" data-i18n="buttons.cancel"></button>
                                        <button type="submit" class="btn btn-primary rounded-pill px-4" id="btnSiguienteEncuesta">
                                            <i class="bi bi-arrow-right me-1"></i>
                                            <span data-i18n="anfitrion.home.next"></span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Panel paso 2: encuesta de criterios -->
                    <div id="encuesta-alta-vivienda" class="d-none">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-4">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h5 class="fw-bold mb-0">
                                        <i class="bi bi-sliders me-2 text-primary"></i>
                                        <span data-i18n="anfitrion.home.registerStep2"></span>
                                    </h5>
                                    <span class="badge rounded-pill px-3 py-2" style="background-color:#EBF0FF;color:var(--color-primario);">2 / 2</span>
                                </div>
                                <p class="text-muted small mb-0 mt-1" data-i18n="survey.pageSubtitle"></p>
                            </div>
                            <div class="card-body p-4">
                                <div class="progress mb-4" style="height:6px;">
                                    <div class="progress-bar" id="progreso-encuesta-vivienda" style="width:0%;background-color:var(--color-primario);transition:width .3s;"></div>
                                </div>
                                <div id="encuesta-vivienda-error" class="alert alert-danger d-none mb-3"></div>
                                <form id="formEncuestaVivienda">
                                    <div id="preguntas-encuesta-vivienda"></div>
                                    <div class="d-flex justify-content-end mt-4">
                                        <button type="submit" class="btn btn-primary rounded-pill px-5" id="btnGuardarEncuestaVivienda">
                                            <i class="bi bi-check-circle me-2"></i>
                                            <span data-i18n="anfitrion.home.savePreferences"></span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div id="con-vivienda" class="d-none">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-4 d-flex justify-content-between align-items-center">
                                <h5 class="fw-bold mb-0">
                                    <i class="bi bi-house me-2 text-primary"></i>
                                    <span data-i18n="anfitrion.cardTitles.homeDetails"></span>
                                </h5>
                                <button class="btn btn-primary-inverse rounded-pill btn-sm px-3" id="btnEditarVivienda">
                                    <i class="bi bi-pencil me-1"></i> <span data-i18n="buttons.edit"></span>
                                </button>
                            </div>
                            <div class="card-body p-4" id="ficha-vivienda"></div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: CRITERIOS -->
                <div class="section-content" data-section="criterios">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-bottom py-4">
                            <h5 class="fw-bold mb-0">
                                <i class="bi bi-sliders me-2 text-primary"></i>
                                <span data-i18n="anfitrion.cardTitles.criteriaTitle"></span>
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th data-i18n="anfitrion.table.criteria"></th>
                                            <th data-i18n="anfitrion.table.preferredValue"></th>
                                            <th data-i18n="anfitrion.table.status"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-criterios"></tbody>
                                </table>
                            </div>
                            <div id="paginacion-tabla-criterios" class="d-flex justify-content-between align-items-center px-3 py-2 border-top flex-wrap gap-2"></div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: huespedes -->
                <div class="section-content" data-section="huespedes">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-bottom py-4">
                            <h5 class="fw-bold mb-0">
                                <i class="bi bi-people me-2 text-primary"></i>
                                <span data-i18n="anfitrion.cardTitles.tenantsTitle"></span>
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th data-i18n="anfitrion.table.tenant"></th>
                                            <th data-i18n="anfitrion.table.startDate"></th>
                                            <th data-i18n="anfitrion.table.status"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-huespedes"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: PERFIL -->
                <div class="section-content" data-section="perfil">
                    <div class="row g-4">
                        <div class="col-lg-4">
                            <div class="card border-0 shadow-sm rounded-4 text-center p-4 mb-4">
                                <div class="avatar-iniciales avatar-iniciales-lg mx-auto mb-3" id="perfil-avatar"></div>
                                <h5 class="fw-bold mb-1" id="perfil-display-nombre"></h5>
                                <span class="badge bg-dark rounded-pill px-3 mb-3" data-i18n="anfitrion.badge"></span>
                                <p class="text-muted small mb-0">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span data-i18n="profile.memberSince"></span> <span id="perfil-fecha-alta"></span>
                                </p>
                            </div>
                            <div data-partial="partials/perfil-cambio-rol.html"></div>
                            <div class="card border-0 shadow-sm rounded-4 p-4">
                                <h6 class="fw-bold text-danger mb-2">
                                    <i class="bi bi-exclamation-triangle me-2"></i>
                                    <span data-i18n="profile.dangerZone"></span>
                                </h6>
                                <p class="text-muted small mb-3" data-i18n="profile.dangerText"></p>
                                <button class="btn btn-outline-danger rounded-pill w-100 btn-sm" id="btnEliminarCuenta">
                                    <i class="bi bi-trash me-2"></i>
                                    <span data-i18n="profile.deleteMyAccount"></span>
                                </button>
                            </div>
                        </div>
                        <div class="col-lg-8">
                            <div class="card border-0 shadow-sm rounded-4 mb-4">
                                <div class="card-header bg-white border-bottom py-4 d-flex justify-content-between align-items-center">
                                    <h5 class="fw-bold mb-0">
                                        <i class="bi bi-person me-2 text-primary"></i>
                                        <span data-i18n="profile.personalData"></span>
                                    </h5>
                                    <button class="btn btn-primary-inverse rounded-pill btn-sm px-3" id="perfil-btnEditar">
                                        <i class="bi bi-pencil me-1"></i> <span data-i18n="profile.edit"></span>
                                    </button>
                                </div>
                                <div class="card-body p-4">
                                    <form id="perfil-form" novalidate>
                                        <div class="row g-3">
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.fullNameLabel"></label>
                                                <input type="text" class="form-control" id="perfil-nombre" value="" disabled>
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.dniLabel"></label>
                                                <input type="text" class="form-control" id="perfil-dni" value="" disabled>
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.emailLabel"></label>
                                                <input type="email" class="form-control" id="perfil-email" value="" disabled>
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.phoneLabel"></label>
                                                <input type="tel" class="form-control" id="perfil-telefono" value="" disabled>
                                            </div>
                                        </div>
                                        <div class="d-none gap-2 justify-content-end mt-4" id="perfil-acciones">
                                            <button type="button" class="btn btn-light rounded-pill px-4" id="perfil-btnCancelar" data-i18n="buttons.cancel"></button>
                                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                                <i class="bi bi-check-circle me-1"></i>
                                                <span data-i18n="buttons.saveChanges"></span>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <div class="card border-0 shadow-sm rounded-4 mb-4">
                                <div class="card-header bg-white border-bottom py-4">
                                    <h5 class="fw-bold mb-0">
                                        <i class="bi bi-shield-lock me-2 text-primary"></i>
                                        <span data-i18n="profile.changePasswordTitle"></span>
                                    </h5>
                                </div>
                                <div class="card-body p-4">
                                    <form id="perfil-form-pwd" novalidate>
                                        <div class="mb-4">
                                            <label class="form-label fw-semibold text-muted small" data-i18n="profile.currentPassword"></label>
                                            <div class="position-relative">
                                                <input type="password" class="form-control pe-5" id="pwd-actual" data-i18n-ph="profile.currentPasswordPh">
                                                <button type="button" class="btn-pwd-toggle" data-toggle-pwd="pwd-actual" tabindex="-1"><i class="bi bi-eye"></i></button>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold text-muted small" data-i18n="profile.newPassword"></label>
                                            <div class="position-relative">
                                                <input type="password" class="form-control pe-5" id="pwd-nueva" data-i18n-ph="profile.newPasswordPh">
                                                <button type="button" class="btn-pwd-toggle" data-toggle-pwd="pwd-nueva" tabindex="-1"><i class="bi bi-eye"></i></button>
                                            </div>
                                            <div id="pwd-strength-wrap" class="mt-2" style="display:none;">
                                                <div class="progress" style="height:4px;">
                                                    <div class="progress-bar" id="pwd-strength-bar" style="width:0%; transition:width .3s,background-color .3s;"></div>
                                                </div>
                                                <small class="d-block mt-1" id="pwd-strength-text"></small>
                                            </div>
                                        </div>
                                        <div class="mb-4">
                                            <label class="form-label fw-semibold text-muted small" data-i18n="profile.confirmPassword"></label>
                                            <div class="position-relative">
                                                <input type="password" class="form-control pe-5" id="pwd-confirmar" data-i18n-ph="profile.confirmPasswordPh">
                                                <button type="button" class="btn-pwd-toggle" data-toggle-pwd="pwd-confirmar" tabindex="-1"><i class="bi bi-eye"></i></button>
                                            </div>
                                        </div>
                                        <div id="pwd-feedback" class="mb-3"></div>
                                        <div class="text-end">
                                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                                <i class="bi bi-lock me-1"></i>
                                                <span data-i18n="buttons.updatePassword"></span>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div data-partial="partials/dashboard-modals-common.html"></div>

    <!-- Modal Baja huesped -->
    <div class="modal fade" id="modalBaja" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        <span data-i18n="anfitrion.modalBaja.title"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4 pt-4 pb-2">
                    <p class="mb-0">
                        <span data-i18n="anfitrion.modalBaja.body"></span>
                        <strong id="baja-nombre"></strong>.
                    </p>
                </div>
                <div class="modal-footer border-0 px-4 pt-2 pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" data-i18n="buttons.cancel"></button>
                    <button type="button" class="btn btn-danger rounded-pill px-4" id="btnConfirmarBaja">
                        <i class="bi bi-check-circle me-1"></i>
                        <span data-i18n="anfitrion.modalBaja.confirmBaja"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script type="module" src="js/anfitrion/dashboard-anfitrion.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</body>
</html>
