<div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
    <h6 class="fw-bold mb-2">
        <i class="bi bi-arrow-left-right me-2 text-primary"></i>
        <span data-i18n="profile.changeRole.title"></span>
    </h6>
    <p class="text-muted small mb-3" data-i18n="profile.changeRole.subtitle"></p>

    <div id="cambio-rol-pendiente" class="alert alert-warning d-none mb-0" role="alert"></div>

    <form id="perfil-form-cambio-rol">
        <div class="mb-3">
            <label class="form-label fw-semibold text-muted small" data-i18n="profile.changeRole.selectLabel"></label>
            <select class="form-select" id="cambio-rol-select"></select>
        </div>
        <button type="submit" class="btn btn-primary-inverse rounded-pill w-100 btn-sm" id="btnSolicitarCambioRol">

            <span data-i18n="profile.changeRole.submit"></span>
        </button>
    </form>
