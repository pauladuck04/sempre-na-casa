<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Sempre na Casa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/settings/variables.css">
    <link rel="stylesheet" href="css/components/components.css">
</head>
<nav class="navbar navbar-light bg-white sticky-top shadow-sm py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand d-flex align-items-center fw-bold" href="public.html" style=" font-size: 1.5rem;">
            <img src="assets/images/logo.jpg" alt="Logo" width="40" height="40" class="d-inline-block align-text-top me-2">
            <span data-i18n="public.brand"></span>
        </a>

        <div class="d-flex align-items-center gap-3">
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1" type="button" id="langDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-globe2"></i>
                    <span id="lang-label">Español</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="langDropdown">
                    <li><button class="dropdown-item lang-option" data-lang="es">🇪🇸 Español</button></li>
                    <li><button class="dropdown-item lang-option" data-lang="en">🇬🇧 English</button></li>
                    <li><button class="dropdown-item lang-option" data-lang="gal">🏴󠁧󠁢󠁳󠁣󠁴󠁿 Galego</button></li>
                </ul>
            </div>
            <a href="tipos-usuarios.html" class="btn btn-soft-primary fw-semibold px-4 rounded-pill text-uppercase" data-i18n="public.nav.register"></a>
            <a href="login.html" class="btn btn-primary fw-semibold px-4 rounded-pill text-uppercase" style="color: white;" data-i18n="public.nav.login"></a>
        </div>
    </div>
</nav>
<body>
    <section class="py-5" style="background-color: #7A99DD;">
        <div class="container text-white text-center">
            <h1 class="display-5 fw-bold mb-3" data-i18n="contact.hero.title"></h1>
            <p class="lead opacity-90 mb-0" data-i18n="contact.hero.subtitle"></p>
        </div>
    </section>

    <section class="py-5 bg-light">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card h-100 border-0 shadow-sm p-4">
                        <h5 class="fw-bold mb-4" data-i18n="contact.info.title"></h5>

                        <div class="d-flex align-items-start gap-3 mb-3">
                            <i class="bi bi-envelope fs-5" style="color: var(--color-primario);"></i>
                            <div>
                                <p class="text-muted small mb-0" data-i18n="contact.info.email"></p>
                                <p class="fw-semibold mb-0">info@semprenacasa.es</p>
                            </div>
                        </div>

                        <div class="d-flex align-items-start gap-3 mb-3">
                            <i class="bi bi-telephone fs-5" style="color: var(--color-primario);"></i>
                            <div>
                                <p class="text-muted small mb-0" data-i18n="contact.info.phone"></p>
                                <p class="fw-semibold mb-0">+34 988 000 000</p>
                            </div>
                        </div>

                        <div class="d-flex align-items-start gap-3 mb-3">
                            <i class="bi bi-geo-alt fs-5" style="color: var(--color-primario);"></i>
                            <div>
                                <p class="text-muted small mb-0" data-i18n="contact.info.location"></p>
                                <p class="fw-semibold mb-0" data-i18n="contact.info.locationValue"></p>
                            </div>
                        </div>

                        <div class="d-flex align-items-start gap-3">
                            <i class="bi bi-clock fs-5" style="color: var(--color-primario);"></i>
                            <div>
                                <p class="text-muted small mb-0" data-i18n="contact.info.hours"></p>
                                <p class="fw-semibold mb-0" data-i18n="contact.info.hoursValue"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card h-100 border-0 shadow-sm p-4">
                        <h5 class="fw-bold mb-4" data-i18n="contact.form.title"></h5>

                        <div id="contacto-success" class="alert alert-success d-none" role="alert">
                            <i class="bi bi-check-circle-fill"></i>
                            <div>
                                <strong data-i18n="contact.form.successTitle"></strong>
                                <div data-i18n="contact.form.successText"></div>
                            </div>
                        </div>

                        <form id="contacto-form" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold" data-i18n="contact.form.name"></label>
                                    <input type="text" class="form-control" id="contacto-nombre" name="nombre">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold" data-i18n="contact.form.email"></label>
                                    <input type="email" class="form-control" id="contacto-email" name="email">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" data-i18n="contact.form.subject"></label>
                                    <input type="text" class="form-control" id="contacto-asunto" name="asunto">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" data-i18n="contact.form.message"></label>
                                    <textarea class="form-control" id="contacto-mensaje" name="mensaje" rows="5"></textarea>
                                </div>
                            </div>
                            <div class="text-end mt-4">
                                <button type="submit" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold" style="color:white;" data-i18n="contact.form.submit"></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
<footer class="footer bg-dark">
    <div class="container-fluid px-5 py-4">
        <div class="row align-items-start">
            <div class="col-md-6 mb-3 mb-md-0">
                <a class="d-flex align-items-center fw-bold text-white text-decoration-none mb-2" href="public.html">
                    <img src="assets/images/logo.JPG" alt="Logo" width="55" height="55" class="me-2 rounded-circle">
                    <span style="font-size: 1.6rem; letter-spacing: 1px;" data-i18n="public.brand"></span>
                </a>
                <p class="text-white-50 mb-0" style="max-width: 600px; font-size: 1.15rem; font-weight: 100;" data-i18n="public.footer.tagline"></p>
            </div>

            <div class="col-md-6 d-flex justify-content-md-end">
                <ul class="list-unstyled text-md-end mb-0">
                    <li class="mb-2"><a href="sobre-nosotros.html" class="text-white text-decoration-none footer-link" data-i18n="public.footer.about"></a></li>
                    <li class="mb-2"><a href="faq.html" class="text-white text-decoration-none footer-link" data-i18n="public.footer.faq"></a></li>
                    <li><a href="contacto.html" class="text-white text-decoration-none footer-link" data-i18n="public.footer.contact"></a></li>
                </ul>
            </div>
        </div>

        <hr class="border-secondary mt-4 mb-3">
        <p class="text-center text-white-50 mb-0" style="font-size: 0.85rem;" data-i18n="public.footer.rights"></p>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/public/contacto.js"></script>
</html>
