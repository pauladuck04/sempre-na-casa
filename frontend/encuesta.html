<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de convivencia - Sempre na Casa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="py-5" style="background-color: #7A99DD; min-height: 300px;">
        <div class="container text-center text-white">
            <h1 class="fw-bold" style="color: var(--color-blanco);" data-i18n="survey.pageTitle">Encuesta de convivencia</h1>
            <p class="opacity-75" data-i18n="survey.pageSubtitle">Responde para encontrar al compañero ideal</p>

            <div class="progress mx-auto mt-4" style="height: 8px; max-width: 400px; background-color: rgba(0,0,0,0.2);">
                <div class="progress-bar" id="encuestaProgress" role="progressbar" style="width: 0%; background-color: #ffffff;"></div>
            </div>
        </div>
    </div>

    <div class="container" style="margin-top: -80px; margin-bottom: 50px;">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">

            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

            <form id="encuesta-form">

                <div class="mb-5" data-criterio="1">
                    <h5 class="fw-bold mb-4" data-i18n="survey.q1.title">1. Nivel de ruido</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="ruido" id="ruido1" value="1">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="ruido1" data-i18n="survey.q1.o1">Silencio absoluto</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="ruido" id="ruido2" value="2">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="ruido2" data-i18n="survey.q1.o2">Ruido moderado (TV, música)</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="ruido" id="ruido3" value="3">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="ruido3" data-i18n="survey.q1.o3">No me importa el ruido</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5" data-criterio="2">
                    <h5 class="fw-bold mb-4" data-i18n="survey.q2.title">2. Hábito de tabaco</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tabaco" id="tabaco1" value="4">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tabaco1" data-i18n="survey.q2.o1">Prohibido totalmente</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tabaco" id="tabaco2" value="5">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tabaco2" data-i18n="survey.q2.o2">Solo en exteriores</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tabaco" id="tabaco3" value="6">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tabaco3" data-i18n="survey.q2.o3">Se permite fumar</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5" data-criterio="3">
                    <h5 class="fw-bold mb-4" data-i18n="survey.q3.title">3. Frecuencia de visitas</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="visitas" id="visitas1" value="7">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="visitas1" data-i18n="survey.q3.o1">Sin visitas</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="visitas" id="visitas2" value="8">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="visitas2" data-i18n="survey.q3.o2">Visitas ocasionales (avisando)</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="visitas" id="visitas3" value="9">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="visitas3" data-i18n="survey.q3.o3">Visitas libres</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5" data-criterio="4">
                    <h5 class="fw-bold mb-4" data-i18n="survey.q4.title">4. Mascotas</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="mascotas" id="mascotas1" value="10">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="mascotas1" data-i18n="survey.q4.o1">NO acepto mascotas</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="mascotas" id="mascotas2" value="11">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="mascotas2" data-i18n="survey.q4.o2">Acepto solo gatos/perros pequeños</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="mascotas" id="mascotas3" value="12">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="mascotas3" data-i18n="survey.q4.o3">Adoro las mascotas</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5" data-criterio="5">
                    <h5 class="fw-bold mb-4" data-i18n="survey.q5.title">5. Limpieza y orden</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="limpieza" id="limpieza1" value="13">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="limpieza1" data-i18n="survey.q5.o1">Muy meticuloso (limpieza diaria)</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="limpieza" id="limpieza2" value="14">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="limpieza2" data-i18n="survey.q5.o2">Estándar (limpieza semanal)</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="limpieza" id="limpieza3" value="15">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="limpieza3" data-i18n="survey.q5.o3">Relajado</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5" data-criterio="6">
                    <h5 class="fw-bold mb-4" data-i18n="survey.q6.title">6. Horarios de vida</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="horarios" id="horarios1" value="16">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="horarios1" data-i18n="survey.q6.o1">Diurno (madrugador)</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="horarios" id="horarios2" value="17">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="horarios2" data-i18n="survey.q6.o2">Mixto/flexible</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="horarios" id="horarios3" value="18">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="horarios3" data-i18n="survey.q6.o3">Nocturno (trasnochador)</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5" data-criterio="7">
                    <h5 class="fw-bold mb-4" data-i18n="survey.q7.title">7. Uso de la cocina</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="cocina" id="cocina1" value="19">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="cocina1" data-i18n="survey.q7.o1">Independencia total</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="cocina" id="cocina2" value="20">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="cocina2" data-i18n="survey.q7.o2">Compartir algunas comidas</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="cocina" id="cocina3" value="21">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="cocina3" data-i18n="survey.q7.o3">Cocinar y comer siempre juntos</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5" data-criterio="8">
                    <h5 class="fw-bold mb-4" data-i18n="survey.q8.title">8. Nivel de interacción social</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="interaccion" id="interaccion1" value="22">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="interaccion1" data-i18n="survey.q8.o1">Solo saludo y cortesía</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="interaccion" id="interaccion2" value="23">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="interaccion2" data-i18n="survey.q8.o2">Charlas ocasionales</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="interaccion" id="interaccion3" value="24">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="interaccion3" data-i18n="survey.q8.o3">Mucha interacción</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5" data-criterio="9">
                    <h5 class="fw-bold mb-4" data-i18n="survey.q9.title">9. Ayuda en tecnología</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tecnologia" id="tecnologia1" value="25">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tecnologia1" data-i18n="survey.q9.o1">No necesito/puedo ayudar</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tecnologia" id="tecnologia2" value="26">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tecnologia2" data-i18n="survey.q9.o2">Ayuda puntual</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tecnologia" id="tecnologia3" value="27">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tecnologia3" data-i18n="survey.q9.o3">Interés en aprender/enseñar tecnología</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5" data-criterio="10">
                    <h5 class="fw-bold mb-4" data-i18n="survey.q10.title">10. Uso de zonas comunes</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="zonas" id="zonas1" value="28">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="zonas1" data-i18n="survey.q10.o1">Uso compartido limitado</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="zonas" id="zonas2" value="29">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="zonas2" data-i18n="survey.q10.o2">Uso compartido bajo horario</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="zonas" id="zonas3" value="30">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="zonas3" data-i18n="survey.q10.o3">Uso libre total</label>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-5">
                    <button id="btnFinalizar" type="submit" class="btn btn-primary px-5 rounded-pill shadow" data-i18n="survey.finishBtn">
                        Crear cuenta
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script type="module" src="js/public/encuesta.js"></script>
</body>
</html>
