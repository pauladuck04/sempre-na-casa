<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de convivencia - Sempre na Casa</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components/components.css">
    <link rel="stylesheet" href="css/generic/base.css">
    <link rel="stylesheet" href="css/pages/pages.css">
    <link rel="stylesheet" href="css/settings/reset.css">
    <link rel="stylesheet" href="css/settings/variables.css">
    <link rel="stylesheet" href="css/tools/utilities.css">
</head>
<body>
    <div class="py-5" style="background-color: #7A99DD; min-height: 300px;">
        <div class="container text-center text-white">
            <h1 class="fw-bold">Encuesta de convivencia</h1>
            <p class="opacity-75">Responde para encontrar al compañero ideal</p>
            
            <div class="progress mx-auto mt-4" style="height: 8px; max-width: 400px; background-color: rgba(0,0,0,0.2);">
                <div class="progress-bar" id="encuestaProgress" role="progressbar" style="width: 0%; background-color: #ffffff;"></div>
            </div>
        </div>
    </div>

    <div class="container" style="margin-top: -80px; margin-bottom: 50px;">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">
            
            <!-- Mensajes de error -->
            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

            <form id="encuesta-form">
                
                <div class="mb-5">
                    <h5 class="fw-bold mb-4">1. Nivel de ruido</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="ruido" id="ruido1" value="1">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="ruido1">Silencio absoluto</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="ruido" id="ruido2" value="2">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="ruido2">Ruido moderado (TV, música)</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="ruido" id="ruido3" value="3">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="ruido3">No me importa el ruido</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <h5 class="fw-bold mb-4">2. Hábito de tabaco</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tabaco" id="tabaco1" value="1">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tabaco1">Prohibido totalmente</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tabaco" id="tabaco2" value="2">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tabaco2">Solo en exteriores</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tabaco" id="tabaco3" value="3">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tabaco3">Se permite fumar</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <h5 class="fw-bold mb-4">3. Frecuencia de visitas</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="visitas" id="visitas1" value="1">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="visitas1">Sin visitas</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="visitas" id="visitas2" value="2">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="visitas2">Visitas ocasionales (avisando)</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="visitas" id="visitas3" value="3">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="visitas3">Visitas libres</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <h5 class="fw-bold mb-4">4. Mascotas</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="mascotas" id="mascotas1" value="1">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="mascotas1">NO acepto mascotas</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="mascotas" id="mascotas2" value="2">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="mascotas2">Acepto solo gatos/perros pequeños</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="mascotas" id="mascotas3" value="3">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="mascotas3">Adoro las mascotas</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <h5 class="fw-bold mb-4">5. Limpieza y orden</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="limpieza" id="limpieza1" value="1">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="limpieza1">Muy meticuloso (limpieza diaria)</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="limpieza" id="limpieza2" value="2">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="limpieza2">Estándar (limpieza semanal)</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="limpieza" id="limpieza3" value="3">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="limpieza3">Relajado</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <h5 class="fw-bold mb-4">6. Horarios de vida</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="horarios" id="horarios1" value="1">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="horarios1">Diurno (madrugador)</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="horarios" id="horarios2" value="2">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="horarios2">Mixto/flexible</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="horarios" id="horarios3" value="3">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="horarios3">Nocturno (trasnochador)</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <h5 class="fw-bold mb-4">7. Uso de la cocina</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="cocina" id="cocina1" value="1">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="cocina1">Independencia total</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="cocina" id="cocina2" value="2">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="cocina2">Compartir algunas comidas</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="cocina" id="cocina3" value="3">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="cocina3">Cocinar y comer siempre juntos</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <h5 class="fw-bold mb-4">8. Nivel de interacción social</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="interaccion" id="interaccion1" value="1">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="interaccion1">Solo saludo y cortesia</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="interaccion" id="interaccion2" value="2">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="interaccion2">Charlas ocasionales</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="interaccion" id="interaccion3" value="3">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="interaccion3">Mucha interaccion</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <h5 class="fw-bold mb-4">9. Ayuda en tecnología</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tecnologia" id="tecnologia1" value="1">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tecnologia1">No necesito/puedo ayudar</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tecnologia" id="tecnologia2" value="2">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tecnologia2">Ayuda puntual</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="tecnologia" id="tecnologia3" value="3">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="tecnologia3">Interes en aprender/enseñar tecnologia</label>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <h5 class="fw-bold mb-4">10. Uso de zonas comunes</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="zonas" id="zonas1" value="1">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="zonas1">Uso compartido limitado</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="zonas" id="zonas2" value="2">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="zonas2">Uso compartido bajo horario</label>
                        </div>
                        <div class="col-md-4">
                            <input type="radio" class="btn-check" name="zonas" id="zonas3" value="3">
                            <label class="btn btn-outline-light-custom w-100 p-3" for="zonas3">Uso libre total</label>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-5">
                    <button id="btnFinalizar" type="submit" class="btn btn-primary-inverse px-5 rounded-pill shadow">
                        Crear cuenta
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/public/encuesta.js"></script>
</body>
</html>
