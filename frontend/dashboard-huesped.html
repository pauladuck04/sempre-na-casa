<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="js/route-guard.js"></script>
    <script>protegerRuta(['huesped']);</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel huesped - Sempre na Casa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-light">
    <div class="d-flex" style="min-height: 100vh;">
        <!-- SIDEBAR -->
        <aside class="sidebar bg-white shadow-sm d-none d-lg-flex flex-column p-4" style="position: fixed; left: 0; top: 0; height: 100vh; width: 280px; overflow-y: auto;">
            <div class="d-flex flex-column align-items-center mb-4">
                <img src="assets/images/logo.JPG" width="60" class="rounded-circle mb-2" alt="Logo"
                     onerror="this.src='https://ui-avatars.com/api/?name=huesped&background=7A99DD&color=fff'">
                <span class="badge bg-dark rounded-pill mb-2" data-i18n="huesped.badge"></span>
                <h5 class="fw-bold mb-0" style="color: var(--color-primario);">Sempre na Casa</h5>
            </div>
            <nav class="nav flex-column gap-2 flex-grow-1">
                <a href="#" class="nav-link active-custom transition section-link" data-section="general">
                    <i class="bi bi-speedometer2 me-2"></i> <span data-i18n="huesped.nav.general"></span>
                </a>
                <a href="#" class="nav-link text-muted transition section-link" data-section="convivencia" id="nav-convivencia">
                    <i class="bi bi-house-heart me-2"></i> <span data-i18n="huesped.nav.convivencia"></span>
                </a>
                <a href="#" class="nav-link text-muted transition section-link" data-section="preferencias">
                    <i class="bi bi-sliders me-2"></i> <span data-i18n="huesped.nav.preferences"></span>
                </a>
                <a href="#" class="nav-link d-none section-link" data-section="perfil"></a>
                <hr class="my-3">
                <a href="public.html" id="btnLogout" class="nav-link text-danger transition">
                    <i class="bi bi-box-arrow-left me-2"></i> <span data-i18n="nav.logout"></span>
                </a>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="flex-grow-1 p-4 p-md-3" style="margin-left: 280px;">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h1 class="fw-bold mb-2" id="section-title" data-i18n="huesped.sections.general.title"></h1>
                    <p class="text-muted" id="section-description" data-i18n="huesped.sections.general.descriptionWithHome"></p>
                </div>
                <div class="d-flex align-items-center">
                    <button id="btnPerfil" class="avatar-iniciales shadow-sm" title="Ver mi perfil"></button>
                </div>
            </div>

            <div id="content-sections">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="gap-2 d-none" id="acciones-globales">
                        <button type="button" class="btn btn-primary rounded-pill px-2 shadow-sm" id="btnCrear">
                            <i class="bi bi-plus-circle me-2"></i> <span data-i18n="buttons.add"></span>
                        </button>
                        <button type="button" class="btn btn-primary-inverse rounded-pill px-2" id="btnEditar" disabled>
                            <i class="bi bi-pencil me-2"></i> <span data-i18n="buttons.edit"></span>
                        </button>
                        <button type="button" class="btn btn-outline-danger rounded-pill px-2" id="btnEliminar" disabled>
                            <i class="bi bi-x-circle me-2"></i> <span data-i18n="buttons.deactivate"></span>
                        </button>
                        <button type="button" class="btn btn-outline-success rounded-pill px-2" id="btnReactivar" disabled>
                            <i class="bi bi-check-circle me-2"></i> <span data-i18n="buttons.activate"></span>
                        </button>
                    </div>
                    <div class="gap-2 flex-wrap d-none" id="filtros-globales">
                        <input type="search" class="form-control" id="filtroTexto" data-i18n-ph="nav.filterList">
                        <div class="d-flex gap-2 flex-wrap" id="filtrosEspecificos"></div>
                    </div>
                </div>

                <!-- SECCIÓN: GENERAL -->
                <div class="section-content active" data-section="general">
                    <!-- SIN CONVIVENCIA -->
                    <div id="general-sin-convivencia" class="d-none">
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <div class="card border-0 shadow-sm rounded-4 h-100">
                                    <div class="card-body p-4 d-flex align-items-center gap-3">
                                        <div class="rounded-3 p-3" style="background-color: #EBF0FF;">
                                            <i class="bi bi-houses fs-4" style="color: var(--color-primario);"></i>
                                        </div>
                                        <div>
                                            <p class="text-muted small mb-1" data-i18n="huesped.summary.availableCandidates"></p>
                                            <h5 class="fw-bold mb-0" id="total-candidatos">-</h5>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card border-0 shadow-sm rounded-4 h-100">
                                    <div class="card-body p-4 d-flex align-items-center gap-3">
                                        <div class="rounded-3 p-3" style="background-color: #E8F5E9;">
                                            <i class="bi bi-graph-up-arrow fs-4 text-success"></i>
                                        </div>
                                        <div>
                                            <p class="text-muted small mb-1" data-i18n="huesped.summary.maxCompatibility"></p>
                                            <h5 class="fw-bold mb-0" id="max-compatibilidad">-</h5>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card border-0 shadow-sm rounded-4 h-100">
                                    <div class="card-body p-4 d-flex align-items-center gap-3">
                                        <div class="rounded-3 p-3" style="background-color: #FFF8E1;">
                                            <i class="bi bi-sliders fs-4 text-warning"></i>
                                        </div>
                                        <div>
                                            <p class="text-muted small mb-1" data-i18n="huesped.summary.activePreferences"></p>
                                            <h5 class="fw-bold mb-0" id="preferencias-activas">-</h5>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-4">
                                <h5 class="fw-bold mb-0">
                                    <i class="bi bi-star me-2 text-primary"></i>
                                    <span data-i18n="huesped.cardTitles.possibleHomes"></span>
                                </h5>
                            </div>
                            <div class="card-body p-4">
                                <div class="row g-3" id="grid-candidatos"></div>
                            </div>
                        </div>
                    </div>

                    <!-- CON CONVIVENCIA -->
                    <div id="general-con-convivencia" class="d-none">
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <div class="card border-0 shadow-sm rounded-4 h-100">
                                    <div class="card-body p-4 d-flex align-items-center gap-3">
                                        <div class="rounded-3 p-3" style="background-color: #EBF0FF;">
                                            <i class="bi bi-clipboard-check fs-4" style="color: var(--color-primario);"></i>
                                        </div>
                                        <div>
                                            <p class="text-muted small mb-1" data-i18n="huesped.summary.requestStatus"></p>
                                            <h5 class="fw-bold mb-0" id="estado-solicitud">-</h5>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card border-0 shadow-sm rounded-4 h-100">
                                    <div class="card-body p-4 d-flex align-items-center gap-3">
                                        <div class="rounded-3 p-3" style="background-color: #E8F5E9;">
                                            <i class="bi bi-graph-up-arrow fs-4 text-success"></i>
                                        </div>
                                        <div>
                                            <p class="text-muted small mb-1" data-i18n="huesped.summary.compatibility"></p>
                                            <h5 class="fw-bold mb-0" id="compatibilidad-score">-</h5>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card border-0 shadow-sm rounded-4 h-100">
                                    <div class="card-body p-4 d-flex align-items-center gap-3">
                                        <div class="rounded-3 p-3" style="background-color: #FFF8E1;">
                                            <i class="bi bi-calendar-check fs-4 text-warning"></i>
                                        </div>
                                        <div>
                                            <p class="text-muted small mb-1" data-i18n="huesped.summary.startDate"></p>
                                            <h5 class="fw-bold mb-0" id="fecha-inicio">-</h5>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-4">
                                <h5 class="fw-bold mb-0">
                                    <i class="bi bi-house-heart me-2 text-primary"></i>
                                    <span data-i18n="huesped.cardTitles.currentConvivencia"></span>
                                </h5>
                            </div>
                            <div class="card-body p-4">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th data-i18n="huesped.table.host"></th>
                                            <th data-i18n="huesped.table.address"></th>
                                            <th data-i18n="huesped.table.startDate"></th>
                                            <th data-i18n="huesped.table.status"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-resumen-convivencia"></tbody>
                                </table>
                                <div id="paginacion-tabla-resumen-convivencia" class="d-flex justify-content-between align-items-center px-3 py-2 border-top"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: MI CONVIVENCIA -->
                <div class="section-content" data-section="convivencia">
                    <div id="sin-convivencia" class="d-none">
                        <div class="card border-0 shadow-sm rounded-4 text-center p-5">
                            <i class="bi bi-house-exclamation fs-1 mb-3" style="color: var(--color-primario);"></i>
                            <h4 class="fw-bold mb-2" data-i18n="huesped.cardTitles.noConvivencia"></h4>
                            <p class="text-muted mb-0" data-i18n="huesped.cardTitles.noConvivenciaSubtitle"></p>
                        </div>
                    </div>
                    <div id="con-convivencia">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-4">
                                <h5 class="fw-bold mb-0">
                                    <i class="bi bi-house me-2 text-primary"></i>
                                    <span data-i18n="huesped.cardTitles.convivenciaDetails"></span>
                                </h5>
                            </div>
                            <div class="card-body p-4" id="ficha-convivencia"></div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: MIS PREFERENCIAS -->
                <div class="section-content" data-section="preferencias">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-bottom py-4">
                            <h5 class="fw-bold mb-0">
                                <i class="bi bi-sliders me-2 text-primary"></i>
                                <span data-i18n="huesped.cardTitles.preferencesTitle"></span>
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th data-i18n="huesped.table.preference"></th>
                                        <th data-i18n="huesped.table.myValue"></th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-preferencias"></tbody>
                            </table>
                            <div id="paginacion-tabla-preferencias" class="d-flex justify-content-between align-items-center px-3 py-2 border-top"></div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: MI PERFIL -->
                <div class="section-content" data-section="perfil">
                    <div class="row g-4">
                        <div class="col-lg-4">
                            <div class="card border-0 shadow-sm rounded-4 text-center p-4 mb-4">
                                <div class="avatar-iniciales avatar-iniciales-lg mx-auto mb-3" id="perfil-avatar"></div>
                                <h5 class="fw-bold mb-1" id="perfil-display-nombre"></h5>
                                <span class="badge bg-dark rounded-pill px-3 mb-3" data-i18n="huesped.badge"></span>
                                <p class="text-muted small mb-0">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span data-i18n="profile.memberSince"></span> <span id="perfil-fecha-alta"></span>
                                </p>
                            </div>
                            <div class="card border-0 shadow-sm rounded-4 p-4">
                                <h6 class="fw-bold text-danger mb-2">
                                    <i class="bi bi-exclamation-triangle me-2"></i>
                                    <span data-i18n="profile.dangerZone"></span>
                                </h6>
                                <p class="text-muted small mb-3" data-i18n="profile.dangerText"></p>
                                <button class="btn btn-outline-danger rounded-pill w-100 btn-sm" id="btnEliminarCuenta">
                                    <i class="bi bi-trash me-2"></i>
                                    <span data-i18n="profile.deleteMyAccount"></span>
                                </button>
                            </div>
                        </div>
                        <div class="col-lg-8">
                            <div class="card border-0 shadow-sm rounded-4 mb-4">
                                <div class="card-header bg-white border-bottom py-4 d-flex justify-content-between align-items-center">
                                    <h5 class="fw-bold mb-0">
                                        <i class="bi bi-person me-2 text-primary"></i>
                                        <span data-i18n="profile.personalData"></span>
                                    </h5>
                                    <button class="btn btn-primary-inverse rounded-pill btn-sm px-3" id="perfil-btnEditar">
                                        <i class="bi bi-pencil me-1"></i> <span data-i18n="profile.edit"></span>
                                    </button>
                                </div>
                                <div class="card-body p-4">
                                    <form id="perfil-form" novalidate>
                                        <div class="row g-3">
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.fullNameLabel"></label>
                                                <input type="text" class="form-control" id="perfil-nombre" value="" disabled>
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.dniLabel"></label>
                                                <input type="text" class="form-control" id="perfil-dni" value="" disabled>
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.emailLabel"></label>
                                                <input type="email" class="form-control" id="perfil-email" value="" disabled>
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold text-muted small" data-i18n="profile.phoneLabel"></label>
                                                <input type="tel" class="form-control" id="perfil-telefono" value="" disabled>
                                            </div>

                                        </div>
                                        <div class="d-none gap-2 justify-content-end mt-4" id="perfil-acciones">
                                            <button type="button" class="btn btn-light rounded-pill px-4" id="perfil-btnCancelar" data-i18n="buttons.cancel"></button>
                                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                                <i class="bi bi-check-circle me-1"></i>
                                                <span data-i18n="buttons.saveChanges"></span>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <div class="card border-0 shadow-sm rounded-4 mb-4">
                                <div class="card-header bg-white border-bottom py-4">
                                    <h5 class="fw-bold mb-0">
                                        <i class="bi bi-shield-lock me-2 text-primary"></i>
                                        <span data-i18n="profile.changePasswordTitle"></span>
                                    </h5>
                                </div>
                                <div class="card-body p-4">
                                    <form id="perfil-form-pwd" novalidate>
                                        <div class="mb-4">
                                            <label class="form-label fw-semibold text-muted small" data-i18n="profile.currentPassword"></label>
                                            <div class="position-relative">
                                                <input type="password" class="form-control pe-5" id="pwd-actual" data-i18n-ph="profile.currentPasswordPh">
                                                <button type="button" class="btn-pwd-toggle" data-toggle-pwd="pwd-actual" tabindex="-1"><i class="bi bi-eye"></i></button>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold text-muted small" data-i18n="profile.newPassword"></label>
                                            <div class="position-relative">
                                                <input type="password" class="form-control pe-5" id="pwd-nueva" data-i18n-ph="profile.newPasswordPh">
                                                <button type="button" class="btn-pwd-toggle" data-toggle-pwd="pwd-nueva" tabindex="-1"><i class="bi bi-eye"></i></button>
                                            </div>
                                            <div id="pwd-strength-wrap" class="mt-2" style="display:none;">
                                                <div class="progress" style="height:4px;">
                                                    <div class="progress-bar" id="pwd-strength-bar" style="width:0%; transition:width .3s,background-color .3s;"></div>
                                                </div>
                                                <small class="d-block mt-1" id="pwd-strength-text"></small>
                                            </div>
                                        </div>
                                        <div class="mb-4">
                                            <label class="form-label fw-semibold text-muted small" data-i18n="profile.confirmPassword"></label>
                                            <div class="position-relative">
                                                <input type="password" class="form-control pe-5" id="pwd-confirmar" data-i18n-ph="profile.confirmPasswordPh">
                                                <button type="button" class="btn-pwd-toggle" data-toggle-pwd="pwd-confirmar" tabindex="-1"><i class="bi bi-eye"></i></button>
                                            </div>
                                        </div>
                                        <div id="pwd-feedback" class="mb-3"></div>
                                        <div class="text-end">
                                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                                <i class="bi bi-lock me-1"></i>
                                                <span data-i18n="buttons.updatePassword"></span>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Genérico -->
    <div class="modal fade" id="modalGenerico" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="modalTitle" data-i18n="modal.newRecord">Nuevo Registro</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="formGenerico">
                    <div class="modal-body p-4" id="modalFormContent"></div>
                    <div id="formGenerico-error" class="alert alert-danger d-none mx-4 mb-3" role="alert"></div>
                    <div class="modal-footer border-0 p-4">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" data-i18n="buttons.cancel">Cancelar</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4" data-i18n="buttons.saveChanges">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Detalle -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="modalDetalleTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header text-white" style="background-color: var(--color-primario);">
                    <h5 class="modal-title fw-bold" id="modalDetalleTitle" data-i18n="modal.details">Detalles</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="modalDetalleContent"></div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" data-i18n="buttons.close">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Eliminar Cuenta -->
    <div class="modal fade" id="modalEliminarCuenta" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-danger text-white border-0">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span data-i18n="modal.deleteAccountTitle">Eliminar cuenta</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="mb-2" data-i18n="modal.deleteAccountBody">¿Estás seguro de que quieres eliminar tu cuenta? Esta acción es permanente e irreversible.</p>
                    <p class="text-muted small mb-0" data-i18n="modal.deleteAccountData">Se eliminarán todos tus datos.</p>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" data-i18n="buttons.cancel">Cancelar</button>
                    <button type="button" class="btn btn-danger rounded-pill px-4" id="btnConfirmarEliminarCuenta">
                        <i class="bi bi-trash me-1"></i>
                        <span data-i18n="modal.confirmDeleteBtn">Sí, eliminar cuenta</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Confirmar Cambio Contraseña -->
    <div class="modal fade" id="modalConfirmarPassword" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-lock me-2"></i>
                        <span data-i18n="modal.confirmPasswordTitle">Confirmar cambio de contraseña</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="mb-0" data-i18n="modal.confirmPasswordBody">¿Estás seguro de que deseas cambiar tu contraseña?</p>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" data-i18n="buttons.cancel">Cancelar</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4" id="btnConfirmarPassword">
                        <i class="bi bi-lock me-1"></i>
                        <span data-i18n="modal.confirmPasswordBtn">Sí, cambiar contraseña</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="toastDashboard" class="toast align-items-center border-0" role="alert" aria-atomic="true">
            <div class="d-flex">
