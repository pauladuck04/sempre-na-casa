<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sempre na Casa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="registro-bg">
        <div class="registro-card">

            <!-- Selector de idioma -->
            <div class="d-flex justify-content-end mb-3">
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1" type="button" id="langDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-globe2"></i>
                        <span id="lang-label">Español</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="langDropdown">
                        <li><button class="dropdown-item lang-option" data-lang="es">🇪🇸 Español</button></li>
                        <li><button class="dropdown-item lang-option" data-lang="en">🇬🇧 English</button></li>
                        <li><button class="dropdown-item lang-option" data-lang="gal">🏴󠁧󠁢󠁳󠁣󠁴󠁿 Galego</button></li>
                    </ul>
                </div>
            </div>

            <!-- Logo + título -->
            <div class="text-center mb-1">
                <img src="./assets/images/logo.JPG" alt="Logo" width="70" height="70" class="rounded-circle mb-1 logo-shadow">
                <h2 class="fw-bold mb-0" data-i18n="register.pageTitle">Crear cuenta</h2>
                <p class="text-muted small">
                    <span data-i18n="register.joinAs">Únete como</span>
                    <span class="fw-semibold" id="rol-label" data-i18n="register.studentRole">🎓 Huésped/Estudiante</span>
                </p>
            </div>

            <!-- Mensajes de estado -->
            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
            <div id="success-message" class="alert alert-success d-none" role="alert"></div>

            <!-- Formulario -->
            <form id="registro-form">
                <input type="hidden" id="rol" name="rol" value="huesped">

                <!-- DNI -->
                <div class="mb-2">
                    <label for="dni" class="form-label fw-semibold" data-i18n="register.dniPassport">DNI / Pasaporte</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-card-text text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 bg-light" id="dni" name="dni"
                               placeholder="12345678A" maxlength="9" required>
                    </div>
                </div>

                <!-- Nombre -->
                <div class="mb-2">
                    <label for="nombre" class="form-label fw-semibold" data-i18n="register.firstName">Nombre</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 bg-light" id="nombre" name="nombre"
                               data-i18n-ph="register.firstName" placeholder="Tu nombre" maxlength="25" required>
                    </div>
                </div>

                <!-- Apellidos -->
                <div class="mb-2">
                    <label for="apellidos" class="form-label fw-semibold" data-i18n="register.surnames">Apellidos</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person-lines-fill text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 bg-light" id="apellidos" name="apellidos"
                               placeholder="Tus apellidos" maxlength="100" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-2">
                    <label for="email" class="form-label fw-semibold" data-i18n="register.emailLabel">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-envelope text-muted"></i>
                        </span>
                        <input type="email" class="form-control border-start-0 bg-light" id="email" name="email"
                               placeholder="tucorreo@ejemplo.com" required>
                    </div>
                </div>

                <!-- Teléfono -->
                <div class="mb-2">
                    <label for="telefono" class="form-label fw-semibold" data-i18n="register.phoneLabel">Número de teléfono</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-telephone text-muted"></i>
                        </span>
                        <input type="tel" class="form-control border-start-0 bg-light" id="telefono" name="telefono"
                               placeholder="612345678" maxlength="9" required>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="mb-2">
                    <label for="password" class="form-label fw-semibold" data-i18n="register.password">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 bg-light" id="password" name="password"
                               placeholder="Mínimo 8 caracteres" minlength="8" maxlength="15" required>
                        <span class="input-group-text bg-light border-start-0 toggle-password" style="cursor:pointer;">
                            <i class="bi bi-eye text-muted" id="icon-pass"></i>
                        </span>
                    </div>
                </div>

                <!-- Repetir contraseña -->
                <div class="mb-3">
                    <label for="password2" class="form-label fw-semibold" data-i18n="register.repeatPassword">Repetir contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock-fill text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 bg-light" id="password2" name="password2"
                               placeholder="Repite tu contraseña" minlength="8" maxlength="15" required>
                        <span class="input-group-text bg-light border-start-0 toggle-password2" style="cursor:pointer;">
                            <i class="bi bi-eye text-muted" id="icon-pass2"></i>
                        </span>
                    </div>
                    <div id="pass-error" class="text-danger small mt-1 d-none" data-i18n="register.passwordMismatch">Las contraseñas no coinciden.</div>
                </div>

                <!-- Botón submit -->
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-pill">
                    <span data-i18n="register.continue">Continuar</span> <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider my-4">
                <span data-i18n="register.alreadyHaveAccount">¿Ya tienes cuenta?</span>
            </div>

            <a href="index.html" class="btn btn-dark w-100 rounded-pill fw-semibold" data-i18n="register.goToLogin">
                Iniciar sesión
            </a>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script type="module" src="js/public/registro.js"></script>
</body>
</html>
