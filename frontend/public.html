<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Sempre na Casa</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/settings/variables.css">
    <link rel="stylesheet" href="css/components/components.css">
</head>
<body>
    <div data-partial="partials/navbar-public.html"></div>
    <header class="intro py-5" style="background-color: #7A99DD;"> <div class="container">
            <div class="row align-items-center min-vh-75">
                <div class="col-lg-7 text-white py-5">
                    <span class="badge rounded-pill bg-light mb-3 px-3 py-2" style="color: #7A99DD;" data-i18n="public.hero.badge"></span>
                    <h1 class="display-3 fw-bold mb-4" data-i18n="public.hero.title"></h1>
                    <p class="lead mb-5 opacity-90" data-i18n="public.hero.subtitle"></p>
                </div>

                <div class="col-lg-5 text-center">
                    <div class="image-wrapper">
                        <img src="assets/images/imagen-landing-page.png" alt="Convivencia" class="img-fluid rounded-4 shadow-lg">
                    </div>
                </div>
            </div>
    </header>

    <section class="how-works py-5 bg-light">
        <div class="container">
            <div class="text-center mb-5">
                <h2 class="display-4 fw-bold mb-3" data-i18n="public.howWorks.title"></h2>
                <p class="lead opacity-75" data-i18n="public.howWorks.subtitle"></p>
            </div>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm p-4 text-center">
                        <div class="icon-wrapper mb-3">
                            <i class="bi bi-person-plus-fill fs-1" style="color: var(--color-primario)"></i>
                        </div>
                        <h5 class="fw-bold" data-i18n="public.howWorks.step1Title"></h5>
                        <p class="text-muted" data-i18n="public.howWorks.step1Text"></p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm p-4 text-center">
                        <div class="icon-wrapper mb-3">
                            <i class="bi bi-cpu fs-1" style="color: var(--color-primario)"></i>
                        </div>
                        <h5 class="fw-bold" data-i18n="public.howWorks.step2Title"></h5>
                        <p class="text-muted" data-i18n="public.howWorks.step2Text"></p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm p-4 text-center">
                        <div class="icon-wrapper mb-3">
                            <i class="bi bi-chat-heart fs-1" style="color: var(--color-primario)"></i>
                        </div>
                        <h5 class="fw-bold" data-i18n="public.howWorks.step3Title"></h5>
                        <p class="text-muted" data-i18n="public.howWorks.step3Text"></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div data-partial="partials/footer-public.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cookies.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script type="module" src="js/public.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setLang();
            const currentLang = localStorage.getItem('lang') || getCookie('lang') || 'ES';
            const langSelect = document.getElementById('lang-select');
            if (langSelect) langSelect.value = currentLang;
        });
    </script>
</body>
</html>
